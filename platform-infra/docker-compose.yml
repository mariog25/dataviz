name: lakehouse-local

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      -  ~/lakehouse-state/minio:/data
    networks:
      - lakehouse
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKETS: ${MINIO_BUCKETS}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
       for b in $$(echo $${MINIO_BUCKETS} | tr ',' ' '); do mc mb -p local/$$b || true; done"
    networks:
      - lakehouse
    profiles: ["init"]

  nessie:
    image: ghcr.io/projectnessie/nessie:0.107.3-java
    depends_on:
      - nessie-db
      - minio
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      # Nessie server
      QUARKUS_HTTP_PORT: "19120"
      NESSIE_VERSION_STORE_TYPE: JDBC
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://nessie-db:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: nessie
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: nessie
      NESSIE_SERVER_AUTHENTICATION_ENABLED: false
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: warehouse
      NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION: s3://lakehouse/warehouse/
      # S3/MinIO so Nessie could be configurated
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_EXTERNAL_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: us-east-1
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE: STATIC
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY: "urn:nessie-secret:quarkus:mysecretsdefault"
      MYSECRETSDEFAULT_NAME: "${MINIO_ROOT_USER}"
      MYSECRETSDEFAULT_SECRET: "${MINIO_ROOT_PASSWORD}"
    networks:
      - lakehouse
    mem_limit: 1g

  nessie-db:
    image: postgres:16
    container_name: nessie-db
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie
    volumes:
      - ~/lakehouse-state/nessie-db:/var/lib/postgresql/data
    networks:
      - lakehouse
    mem_limit: 1g

  trino:
    image: trinodb/trino:458
    depends_on:
      - nessie
      - minio
    ports:
      - "8080:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TRINO_JVM_CONFIG: "-Xmx2048M"
    volumes:
      - ./configs/trino/catalog:/etc/trino/catalog
    networks:
      - lakehouse
    mem_limit: 3g

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    depends_on:
      - nessie
      - minio
    environment:
      SPARK_MODE: master
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
    ports:
      - "7077:7077"
      - "8082:8080"
    volumes:
      - ./configs/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ../data-workloads:/opt/data-workloads
    networks:
      - lakehouse
    mem_limit: 2g

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_NO_DAEMONIZE: "true"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
    volumes:
      - ./configs/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ../data-workloads:/opt/data-workloads
    networks:
      - lakehouse
    mem_limit: 3g

  jupyterlab:
    build:
      context: .
      dockerfile: dockerfile.jupyterlab
    depends_on:
      - spark-master
      - minio
      - nessie
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
    volumes:
      - ./configs/jupyter/notebooks:/home/jovyan/work/notebooks
      - ../data-workloads:/home/jovyan/work/data-workloads
    networks:
      - lakehouse
    mem_limit: 1g

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ~/lakehouse-state/airflow_data/bbdd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lakehouse]

  airflow-webserver:
    build:
      context: .
      dockerfile: dockerfile.airflow
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    profiles: ["airflow"]
    env_file: ./configs/airflow/.env
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "MTbdVog_rwIXZHWZOhCOHAoDiBPudYZ2nSqq0UK1isk="
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: "local_webserver_secret_key"
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
      AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: "8793"
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_HOST: airflow-scheduler
      AIRFLOW__DATAHUB__SERVERAIRFLOW__DATAHUB__ENABLED: "true"
      AIRFLOW__DATAHUB__DATAHUB_CONN_ID: "datahub_rest_default"
      AIRFLOW__DATAHUB__ENABLE_EXTRACTORS: "true"
      AIRFLOW__DATAHUB__PATCH_SQL_PARSER: "true"
      AIRFLOW__DATAHUB__ENABLE_DATA_PROCESS_INSTANCE: "true"
      AIRFLOW__DATAHUB__TOKEN: "${DATAHUB_PAT}"
      AIRFLOW__DATAHUB__ENABLED: "true"
      AIRFLOW__DATAHUB__CLUSTER: "dev"
      AIRFLOW__DATAHUB__LOG_LEVEL: "DEBUG"
      AIRFLOW__DATAHUB__DEBUG_EMITTER: "true"
      SPARK_MASTER_URL: spark://spark-master:7077
    command: webserver
    ports:
      - "8081:8080"
    volumes:
      - ./configs/airflow/dags:/opt/airflow/dags
      - ~/lakehouse-state/airflow_data/logs:/opt/airflow/logs
      - ~/lakehouse-state/airflow_data/plugins:/opt/airflow/plugins
    networks:
      - lakehouse
    mem_limit: 2g

  airflow-scheduler:
    build:
      context: .
      dockerfile: dockerfile.airflow
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file: ./configs/airflow/.env
    environment: *airflow_env
    volumes:
      - ./configs/airflow/dags:/opt/airflow/dags
      - ~/lakehouse-state/airflow_data/logs:/opt/airflow/logs
      - ~/lakehouse-state/airflow_data/plugins:/opt/airflow/plugins
    command: scheduler
    mem_limit: 2g
    networks: [lakehouse]

  airflow-init:
    image: apache/airflow:2.10.3-python3.11
    depends_on:
      airflow-db:
        condition: service_healthy
    env_file: ./configs/airflow/.env
    environment: *airflow_env
    command: >
      bash -lc "
      airflow db migrate &&
      airflow connections delete datahub_rest_default || true &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true
      "
    networks: [lakehouse]

  datahub-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - lakehouse
    mem_limit: 512m

  datahub-kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - datahub-zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: datahub-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://datahub-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - lakehouse
    mem_limit: 1g

  datahub-mysql:
    image: mysql:8.2
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
      MYSQL_ROOT_PASSWORD: datahubroot
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - ~/lakehouse-state/datahub-mysql:/var/lib/mysql
    networks:
      - lakehouse
    mem_limit: 1g

  datahub-elasticsearch-perms:
    image: busybox:1.36
    user: "0:0"
    command: ["sh","-lc","chown -R 1000:0 /usr/share/elasticsearch/data && chmod -R 775 /usr/share/elasticsearch/data"]
    volumes:
      - ~/lakehouse-state/datahub-es:/usr/share/elasticsearch/data
    networks:
      - lakehouse

  datahub-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
    depends_on:
      - datahub-elasticsearch-perms
    user: "1000:0"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - ~/lakehouse-state/datahub-es:/usr/share/elasticsearch/data
    networks:
      - lakehouse
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  datahub-mysql-setup:
    image: acryldata/datahub-mysql-setup:v1.3.0.1
    depends_on:
      datahub-mysql:
        condition: service_started
    environment:
      DATAHUB_DB_NAME: datahub
      MYSQL_HOST: datahub-mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: datahub
      MYSQL_PASSWORD: datahub
      MYSQL_ROOT_PASSWORD: datahubroot
    networks:
      - lakehouse

  datahub-elasticsearch-setup:
    image: acryldata/datahub-elasticsearch-setup:v1.3.0.1
    depends_on:
      datahub-elasticsearch:
        condition: service_healthy
    command: ["/bin/sh", "-c", "sleep 20 && /create-indices.sh"]
    environment:
      ELASTICSEARCH_HOST: datahub-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
    networks:
      - lakehouse

  datahub-system-update:
    image: acryldata/datahub-upgrade:v1.3.0.1
    depends_on:
      datahub-mysql:
        condition: service_started
      datahub-mysql-setup:
        condition: service_completed_successfully
      datahub-elasticsearch:
        condition: service_healthy
      datahub-elasticsearch-setup:
        condition: service_completed_successfully
      datahub-kafka:
        condition: service_started
    command: ["-u", "SystemUpdate"]
    environment:
      SCHEMA_REGISTRY_TYPE: INTERNAL
      SCHEMA_REGISTRY_SYSTEM_UPDATE: "true"
      KAFKA_BOOTSTRAP_SERVER: datahub-kafka:9092
      KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
      EBEAN_DATASOURCE_HOST: datahub-mysql:3306
      EBEAN_DATASOURCE_URL: jdbc:mysql://datahub-mysql:3306/datahub
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      ELASTICSEARCH_HOST: datahub-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      GRAPH_SERVICE_IMPL: elasticsearch
      DATAHUB_SECRET: ${DATAHUB_SECRET}
      DATAHUB_PRECREATE_TOPICS: "true"
      DATAHUB_SQL_SETUP_ENABLED: "true"
    networks:
      - lakehouse

  datahub-gms:
    image: acryldata/datahub-gms:v1.3.0.1
    depends_on:
      datahub-system-update:
        condition: service_completed_successfully
    environment:
      KAFKA_SCHEMAREGISTRY_TYPE: INTERNAL
      SCHEMA_REGISTRY_URL: "http://datahub-gms:8080/schema-registry/api/"
      KAFKA_SCHEMAREGISTRY_URL: "http://datahub-gms:8080/schema-registry/api/"
      GRAPH_SERVICE_IMPL: "elasticsearch"
      SKIP_NEO4J_CHECK: "true"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      EBEAN_DATASOURCE_HOST: datahub-mysql:3306
      EBEAN_DATASOURCE_URL: jdbc:mysql://datahub-mysql:3306/datahub
      KAFKA_BOOTSTRAP_SERVER: datahub-kafka:9092
      DATAHUB_SECRET: ${DATAHUB_SECRET}
      ELASTICSEARCH_HOST: datahub-elasticsearch
      ELASTICSEARCH_PORT: 9200
      DATAHUB_GMS_HEAP_OPTS: "-Xms1g -Xmx2g"
      METADATA_SERVICE_AUTH_ENABLED: "true"
      DATAHUB_SYSTEM_CLIENT_SECRET: ${DATAHUB_SECRET}
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SIGNING_KEY}
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SALT}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/config >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    ports:
      - "8084:8080"
    networks:
      - lakehouse
    mem_limit: 3g

  datahub-frontend:
    image: acryldata/datahub-frontend-react:v1.3.0.1
    depends_on:
      - datahub-gms
    environment:
      DATAHUB_SECRET: ${DATAHUB_SECRET}
      KAFKA_BOOTSTRAP_SERVER: datahub-kafka:9092
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: 8080
      METADATA_SERVICE_AUTH_ENABLED: "true"
      DATAHUB_SYSTEM_CLIENT_SECRET: ${DATAHUB_SECRET}
    ports:
      - "9002:9002"
    networks:
      - lakehouse
    mem_limit: 1g

  datahub-load-indices:
    image: acryldata/datahub-upgrade:v1.3.0.1
    depends_on:
      datahub-mysql:
        condition: service_started
      datahub-elasticsearch:
        condition: service_healthy
      datahub-gms:
        condition: service_healthy
      datahub-kafka:
        condition: service_started
    #command: ["-u", "RestoreIndices"]
    command: ["-u", "RestoreIndices"]
    environment:
      EBEAN_DATASOURCE_HOST: datahub-mysql:3306
      EBEAN_DATASOURCE_URL: jdbc:mysql://datahub-mysql:3306/datahub
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      ELASTICSEARCH_HOST: datahub-elasticsearch
      KAFKA_BOOTSTRAP_SERVER: datahub-kafka:9092
      KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      GRAPH_SERVICE_IMPL: elasticsearch
      DATAHUB_SECRET: ${DATAHUB_SECRET}
    networks:
      - lakehouse
    mem_limit: 1g

  datahub-mae-consumer:
    image: acryldata/datahub-mae-consumer:v1.3.0.1
    depends_on:
      datahub-gms:
        condition: service_healthy
      datahub-kafka:
        condition: service_started
      datahub-elasticsearch:
        condition: service_healthy
      datahub-mysql:
        condition: service_started
    hostname: datahub-mae-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVER: datahub-kafka:9092
      KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      EBEAN_DATASOURCE_HOST: datahub-mysql:3306
      EBEAN_DATASOURCE_URL: jdbc:mysql://datahub-mysql:3306/datahub
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      ELASTICSEARCH_HOST: datahub-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ES_BULK_REFRESH_POLICY: WAIT_UNTIL
      GRAPH_SERVICE_IMPL: elasticsearch
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-mae-consumer/resources/entity-registry.yml
      MAE_CONSUMER_ENABLED: "true"
      PE_CONSUMER_ENABLED: "false"
      KAFKA_CONSUMER_HEALTH_CHECK_ENABLED: "true"
      KAFKA_CONSUMER_STOP_ON_DESERIALIZATION_ERROR: "true"
      DATAHUB_UPGRADE_HISTORY_KAFKA_CONSUMER_GROUP_ID: generic-duhe-consumer-job-client-mcl
      DATAHUB_SECRET: ${DATAHUB_SECRET}
      SKIP_ELASTICSEARCH_CHECK: "false"
      SKIP_MIGRATIONS: "true"
      SKIP_NEO4J_CHECK: "true"
      METADATA_SERVICE_AUTH_ENABLED: "true"
      DATAHUB_SYSTEM_CLIENT_SECRET: ${DATAHUB_SECRET}
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SIGNING_KEY}
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SALT}

    volumes:
      - ./configs/datahub/entity-registry.yml:/datahub/datahub-mae-consumer/resources/entity-registry.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9091/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 120s
    networks:
      - lakehouse
    mem_limit: 2g


  vault:
    image: hashicorp/vault:1.16
    container_name: vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://vault:8200"
    command: vault server -config=/vault/config/vault-config.hcl
    volumes:
      - ./configs/vault/vault-config.hcl:/vault/config/vault-config.hcl:ro
      - ${HOME}/lakehouse-state/vault/vault-data:/vault/data
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse

networks:
  lakehouse:
    name: lakehouse
